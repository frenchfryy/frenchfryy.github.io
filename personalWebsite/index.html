<!DOCTYPE html>
<html>
    <body>
        <style>
            h1 {text-align: center;}
        </style>
        <title>ANTOINE NOUGER</title>
        <h1>Antoine Nouger</h1>

        <script>
        function clock() {
            let date = new Date(); 
            let hh = date.getHours();
            let mm = date.getMinutes();
            let ss = date.getSeconds();
            let session = "AM";
          
            if(hh == 0){
                hh = 12;
            }
            if(hh > 12){
                hh = hh - 12;
                session = "PM";
             }
          
             hh = (hh < 10) ? "0" + hh : hh;
             mm = (mm < 10) ? "0" + mm : mm;
             ss = (ss < 10) ? "0" + ss : ss;
              
             let time = hh + ":" + mm + ":" + ss + " " + session;
          
            document.getElementById("clock").innerText = time; 
            let t = setTimeout(function(){ clock() }, 1000);
          }
          clock();
          </script>
    </body>
</html>
